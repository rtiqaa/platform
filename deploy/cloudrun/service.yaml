apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: rtiqa-app
  labels:
    cloud.googleapis.com/location: europe-west1
    app.kubernetes.io/name: rtiqa
    app.kubernetes.io/part-of: rtiqa-platform
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/description: "Rtiqa Smart Education Platform Production Gateway & API"
spec:
  template:
    metadata:
      annotations:
        # Connect to Cloud SQL instance securely via Unix domain socket
        run.googleapis.com/cloudsql-instances: PROJECT_ID:REGION:rtiqa-db-primary
        # Ingress request timeout (seconds)
        run.googleapis.com/timeoutSeconds: "60"
        # Autoscaling constraints
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        # Maximum concurrent requests per container instance (aligned with PGMAX_POOL)
        autoscaling.knative.dev/target: "80"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 60
      serviceAccountName: rtiqa-cloudrun-sa@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: europe-west1-docker.pkg.dev/PROJECT_ID/rtiqa-repo/rtiqa-app:latest
          ports:
            - name: http1
              containerPort: 3000
          resources:
            limits:
              cpu: "1000m"
              memory: "1Gi"
            requests:
              cpu: "500m"
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 3
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: APP_URL
              value: "https://rtiqa.com"
            - name: STORAGE_PROVIDER
              value: "s3"
            - name: S3_REGION
              value: "auto"
            - name: S3_FORCE_PATH_STYLE
              value: "false"
            - name: STORAGE_URL_TTL
              value: "900"
            - name: PGMAX_POOL
              value: "20"
            # Production Secrets referenced from Google Secret Manager
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rtiqa-database-url
                  key: latest
            - name: DIRECT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rtiqa-direct-database-url
                  key: latest
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: rtiqa-auth-secret
                  key: latest
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: rtiqa-r2-bucket
                  key: latest
            - name: S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: rtiqa-r2-endpoint
                  key: latest
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: rtiqa-r2-access-key-id
                  key: latest
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rtiqa-r2-secret-access-key
                  key: latest
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rtiqa-gemini-api-key
                  key: latest
            - name: FORM_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: rtiqa-form-webhook-url
                  key: latest
